[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rain-risk-mlops"
version = "0.1.0"
description = "Aplikasi dan pipeline MLOps prediksi risiko hujan tiga jam ke depan."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "dvc>=3.67.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rain_prediction"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
