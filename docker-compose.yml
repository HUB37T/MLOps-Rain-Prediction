services:
  backend:
    image: rain-risk-backend:demo
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment:
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:--7.9666}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-112.6326}
      RAIN_PREDICTION_DB_PATH: /app/data/predictions/predictions.db
    volumes:
      - ./data/predictions:/app/data/predictions
    ports:
      - "${API_PORT:-8000}:8000"
    

  frontend:
    image: rain-risk-frontend:demo
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
