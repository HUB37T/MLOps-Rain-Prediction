services:
  backend:
    image: rain-risk-backend:demo
    restart: unless-stopped
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment:
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:--7.9666}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-112.6326}
      RAIN_PREDICTION_DB_PATH: /app/data/predictions/predictions.db
    volumes:
      - ./data/predictions:/app/data/predictions
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/docs',
          timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: rain-risk-frontend:demo
    restart: unless-stopped
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/backend/mlflow.db
      - --artifacts-destination
      - file:///mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --allowed-hosts
      - "localhost:*,127.0.0.1:*"
    volumes:
      - ./data/mlflow/backend:/mlflow/backend
      - ./data/mlflow/artifacts:/mlflow/artifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:5000/health',
          timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s