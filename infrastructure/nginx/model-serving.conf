resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

upstream rain_models {
    zone rain_models 64k;
    # Re-resolve Compose DNS after scaling or container replacement.
    server model-api:8080 resolve;
}

server {
    listen 80;
    client_max_body_size 1m;

    location / {
        proxy_pass http://rain_models;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        # Evidence of which replica handled a request during the LK simulation.
        add_header X-Model-Upstream $upstream_addr always;
    }
}
