global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mlflow-model
    metrics_path: /metrics
    dns_sd_configs:
      - names: [model-api]
        type: A
        port: 8080
        refresh_interval: 5s
