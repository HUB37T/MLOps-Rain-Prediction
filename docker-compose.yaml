services:
  backend:
    image: rain-risk-backend:demo
    restart: unless-stopped
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment:
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:--7.9666}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-112.6326}
      RAIN_PREDICTION_DB_PATH: /app/data/predictions/predictions.db
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - rain-network
    volumes:
      - ${PREDICTION_DATA_DIR:-./data/predictions}:/app/data/predictions
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/docs',
          timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: rain-risk-frontend:demo
    restart: unless-stopped
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rain-network
    ports:
      - "${WEB_PORT:-8080}:80"
    
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/backend/mlflow.db
      - --artifacts-destination
      - file:///mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --allowed-hosts
      - "mlflow:*,localhost:*,127.0.0.1:*"
    networks:
      - rain-network
    volumes:
      - ${MLFLOW_BACKEND_DIR:-./data/mlflow/backend}:/mlflow/backend
      - ${MLFLOW_ARTIFACT_DIR:-./data/mlflow/artifacts}:/mlflow/artifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:5000/api/2.0/mlflow/experiments/get?experiment_id=0',
          timeout=10)
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s

  # LK-10: opt in explicitly; normal LK-09 startup does not load three models.
  model-api:
    profiles: [serving]
    image: ${MODEL_MONITORED_IMAGE:-rain-risk-model:v2-observed}
    pull_policy: never
    build:
      context: infrastructure/monitoring/model
      args:
        MODEL_BASE_IMAGE: ${MODEL_SERVING_IMAGE:-rain-risk-model:v2}
    restart: unless-stopped
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    expose:
      - "8080"
    networks:
      - rain-network
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/ping', timeout=5)
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s

  model-gateway:
    profiles: [serving]
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      model-api:
        condition: service_healthy
    networks:
      - rain-network
    volumes:
      - ./infrastructure/nginx/model-serving.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${MODEL_SERVING_PORT:-5001}:80"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/ping]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.13.5
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - rain-network

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.4.4
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/model-overview.json
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    networks:
      - rain-network

volumes:
  prometheus-data:
  grafana-data:

networks:
  rain-network:
    driver: bridge
