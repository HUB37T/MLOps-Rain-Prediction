services:
  backend:
    image: rain-risk-backend:demo
    restart: unless-stopped
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment:
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:--7.9666}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-112.6326}
      RAIN_PREDICTION_DB_PATH: /app/data/predictions/predictions.db
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - rain-network
    volumes:
      - ${PREDICTION_DATA_DIR:-./data/predictions}:/app/data/predictions
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/docs',
          timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: rain-risk-frontend:demo
    restart: unless-stopped
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rain-network
    ports:
      - "${WEB_PORT:-8080}:80"
    
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/backend/mlflow.db
      - --artifacts-destination
      - file:///mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --allowed-hosts
      - "mlflow:*,localhost:*,127.0.0.1:*"
    networks:
      - rain-network
    volumes:
      - ${MLFLOW_BACKEND_DIR:-./data/mlflow/backend}:/mlflow/backend
      - ${MLFLOW_ARTIFACT_DIR:-./data/mlflow/artifacts}:/mlflow/artifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:5000/api/2.0/mlflow/experiments/get?experiment_id=0',
          timeout=10)
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s

  # LK-10: opt in explicitly; normal LK-09 startup does not load three models.
  model-api:
    profiles: [serving]
    image: ${MODEL_SERVING_IMAGE:-rain-risk-model:v2}
    pull_policy: never
    restart: unless-stopped
    environment:
      DISABLE_NGINX: "false"
      MLFLOW_MODELS_WORKERS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    expose:
      - "8080"
    networks:
      - rain-network
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/ping', timeout=5)
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s

  model-gateway:
    profiles: [serving]
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      model-api:
        condition: service_healthy
    networks:
      - rain-network
    volumes:
      - ./infrastructure/nginx/model-serving.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${MODEL_SERVING_PORT:-5001}:80"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/ping]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  rain-network:
    driver: bridge
